name: Code Checks

on:
  workflow_dispatch:
  push:
    branches: ['main', 'dev-*']
  pull_request:
  release:
    types: [published]

jobs:
  pre-commit:
    name: "Run pre-commit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: pre-commit/action@v3.0.1

  optional-deps:
    name: "Static check optional deps"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: |
          python .github/scripts/no_pandas.py great_tables _tbl_data.py data/__init__.py skill/assets/examples/financial/financial.py skill/assets/examples/heatmap/heatmap.py skill/assets/examples/ranking/ranking.py skill/assets/examples/scientific/scientific.py skill/assets/examples/summary_stats/summary_stats.py skill/assets/examples/time_series/time_series.py
