name: CI GTI

# The <gt-table> runtime in packages/gti. The browser tests use real Great Tables HTML, so this
# also runs when the Python package changes.
on:
  push:
    branches:
      - main
    paths:
      - "packages/gti/**"
      - "great_tables/**"
      - ".github/workflows/ci-gti.yaml"
  pull_request:
    paths:
      - "packages/gti/**"
      - "great_tables/**"
      - ".github/workflows/ci-gti.yaml"

jobs:
  gti:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gti
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/gti/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install great_tables (for the e2e fixtures)
        working-directory: .
        run: pip install -e . pandas
      - name: Install dependencies
        run: npm ci
      - name: Type-check, bundle freshness and size budget
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/gti/test-results/
            packages/gti/playwright-report/
          if-no-files-found: ignore
