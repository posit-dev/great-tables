name: CI GTI

# The <gt-table> runtime in packages/gti. The browser tests use real Great Tables HTML, so this
# also runs when the Python package changes.
on:
  push:
    branches:
      - main
    paths:
      - "packages/gti/**"
      - "great_tables/**"
      - ".github/workflows/ci-gti.yaml"
  pull_request:
    paths:
      - "packages/gti/**"
      - "great_tables/**"
      - ".github/workflows/ci-gti.yaml"

jobs:
  gti:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gti
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/gti/package-lock.json
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install great_tables (for the e2e fixtures)
        working-directory: .
        run: uv pip install -e . pandas
      - name: Install dependencies
        run: npm ci
      - name: Type-check, bundle freshness and size budget
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Query tests (Python's filters and sorts against the runtime's)
        working-directory: .
        run: |
          uv pip install narwhals hypothesis polars pyarrow pytest pytest-cov
          pytest tests/test_gti_query.py --no-cov
      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install the hosts (for the host tests)
        working-directory: .
        run: uv pip install nbconvert ipykernel jupyterlab shiny marimo streamlit
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Browser tests
        run: npm run test:e2e
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/gti/test-results/
            packages/gti/playwright-report/
          if-no-files-found: ignore
