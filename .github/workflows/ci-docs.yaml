name: CI Docs

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-docs:
    name: "Build Docs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version comes from git tags, and gt-extras needs great-tables>=0.18
          fetch-depth: 0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install dependencies
        run: |
          uv pip install \
            "great-docs[svg] @ git+https://github.com/posit-dev/great-docs.git@main" \
            polars pandas numpy pyarrow plotnine gt-extras pointblank "ibis-framework[duckdb]" \
            ".[extra,widget,streamlit,panel,marimo,solara]" shiny
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Build the live app demos
        run: |
          python demos/build.py
      - name: Build docs
        run: |
          great-docs build --jobs auto
      - name: Save docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: great-docs/_site

  publish-docs:
    name: "Publish Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: great-docs/_site
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: great-docs/_site
