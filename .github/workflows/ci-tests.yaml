on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

name: CI Tests

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install dependencies
        run: |
          # we are using the -e flag, so that code cov finds the source.
          # this is not ideal, since installing an editable can technically
          # differ from a normal install in surprising ways.
          uv pip install -e '.[all]'
      - name: pytest unit tests
        run: |
          make test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          name: "py${{ matrix.python-version }}"
          token: ${{ secrets.CODECOV_TOKEN }}

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install dependencies
        run: |
          uv pip install -e '.[all]'
      - name: pytest unit tests
        run: |
          make test

  test-pandas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install dependencies
        run: |
          uv pip install -e '.[dev-no-pandas]'
      - name: pytest unit tests
        run: |
          make test-no-pandas

  release-pypi:
    name: "Release to pypi"
    runs-on: ubuntu-latest
    environment: deploy-pypi
    needs: [build, test-pandas]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: "Build Package"
        run: |
          python -m pip install build wheel
          python -m build --sdist --wheel
      - name: "Deploy to PyPI"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
