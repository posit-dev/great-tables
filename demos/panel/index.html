    (function() {
      // Records failed connections so the loader can report them instead
      // of spinning until it times out.
      const NativeWebSocket = window.WebSocket;
      function TrackedWebSocket(...args) {
        const ws = new NativeWebSocket(...args);
        ws.addEventListener('error', () => { window._panelConnectionError = true; });
        ws.addEventListener('close', (e) => { if (e.code !== 1000) { window._panelConnectionError = true; } });
        return ws;
      }
      TrackedWebSocket.prototype = NativeWebSocket.prototype;
      for (const state of ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED']) {
        Object.defineProperty(TrackedWebSocket, state, {value: NativeWebSocket[state]});
      }
      window.WebSocket = TrackedWebSocket;
    })();
  </script>

            pyodideWorker.queue = []
            pyodideWorker.postMessage({type: 'patch', patch: patch})
          } else {
            pyodideWorker.busy = false
          }
        } else if (msg.type === 'status') {
          window.panelLoader?.status(msg.msg)
        } else if (msg.type === 'error') {
          window.panelLoader?.error(msg.msg)
        } else if (msg.type === 'render') {
          const docs_json = JSON.parse(msg.docs_json)
          const render_items = JSON.parse(msg.render_items)
          const root_ids = JSON.parse(msg.root_ids)
      
          // Remap roots in message to element IDs
          const root_els = document.querySelectorAll('[data-root-id]')
          const data_roots = []
          for (const el of root_els) {
             el.innerHTML = ''
             data_roots.push([el.getAttribute('data-root-id'), el.id])
          }
          data_roots.sort((a, b) => a[0]<b[0] ? -1: 1)
          const roots = {}

          Bokeh.index.roots.map((v) => v.remove())
